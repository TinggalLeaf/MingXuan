<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#241e13"/>
      <stop offset="60%" stop-color="#14110b"/>
      <stop offset="100%" stop-color="#0b0907"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8cf9a"/>
      <stop offset="55%" stop-color="#c9a45c"/>
      <stop offset="100%" stop-color="#a98443"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4dd6f7"/>
      <stop offset="100%" stop-color="#22b8e0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 底盘 -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="#c9a45c" stroke-opacity="0.35" stroke-width="6"/>

  <!-- 外环刻度（八卦爻位意象：八组刻纹） -->
  <g stroke="url(#gold)" stroke-width="26" stroke-linecap="round" filter="url(#glow)">
    <g transform="rotate(0 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(45 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(90 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(135 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(180 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(225 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(270 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
    <g transform="rotate(315 512 512)"><line x1="512" y1="120" x2="512" y2="196"/></g>
  </g>

  <!-- 中环 -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#c9a45c" stroke-opacity="0.55" stroke-width="8"/>

  <!-- 科技轨道（斜环 + 光点） -->
  <ellipse cx="512" cy="512" rx="392" ry="150" fill="none" stroke="url(#cyber)" stroke-width="10"
           stroke-opacity="0.85" transform="rotate(-24 512 512)" filter="url(#glow)"/>
  <circle cx="812" cy="424" r="26" fill="url(#cyber)" filter="url(#glow)"/>

  <!-- 太极 -->
  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="230" fill="url(#gold)"/>
    <path d="M512 282 a230 230 0 0 1 0 460 a115 115 0 0 1 0-230 a115 115 0 0 0 0-230z" fill="#c8402a"/>
    <circle cx="512" cy="397" r="115" fill="#c8402a"/>
    <circle cx="512" cy="627" r="115" fill="url(#gold)"/>
    <circle cx="512" cy="397" r="34" fill="url(#gold)"/>
    <circle cx="512" cy="627" r="34" fill="#c8402a"/>
    <circle cx="512" cy="512" r="230" fill="none" stroke="#0b0907" stroke-opacity="0.4" stroke-width="6"/>
  </g>
</svg>
